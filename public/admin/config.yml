locale: ko
backend:
  name: github
  repo: malangnuo/malangnuo-site
  branch: main
  base_url: https://malangnuo.com
  auth_endpoint: cms-auth/auth
  squash_merges: true
publish_mode: editorial_workflow
site_url: https://malangnuo.com
display_url: https://malangnuo.com
logo_url: https://malangnuo.com/avatar.webp
media_folder: public/uploads
public_folder: /uploads
slug:
  encoding: ascii
  clean_accents: true
collections:
  - name: posts
    label: 포스팅
    label_singular: 포스팅
    folder: src/data/posts
    create: true
    delete: false
    format: frontmatter
    extension: md
    identifier_field: title
    slug: '{{fields.slug}}'
    summary: '{{title}} · {{publishDate}}'
    sortable_fields: [publishDate, title]
    fields:
      - label: 제목
        name: title
        widget: string
      - label: 글 주소
        name: slug
        widget: string
        pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', '영문 소문자, 숫자, 하이픈을 사용해주세요.']
        hint: '예: my-first-post. 발행 후에는 변경하지 마세요. 기존 글의 주소도 그대로 유지해주세요.'
      - label: 발행일
        name: publishDate
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
        hint: '정렬과 최신 글 표시에 사용됩니다. 미래 날짜도 즉시 공개되므로 예약 발행 기능은 아닙니다.'
      - label: 목록 설명
        name: description
        widget: text
      - label: 소개 문구
        name: introText
        widget: text
        hint: 홈의 최신 기록 영역에 표시됩니다.
      - label: 작성자
        name: author
        widget: string
        default: 말랑누오
      - label: 태그
        name: tags
        widget: list
        default: []
      - label: 본문
        name: body
        widget: markdown
        hint: '첫 줄에 # 제목을 적어주세요. 이미지 버튼으로 첨부할 수 있습니다.'
